services:
  mysql:
    image: mysql:8.0
    container_name: estateplanner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: estateplanner
      MYSQL_USER: estateplanner
      MYSQL_PASSWORD: estateplanner_secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
